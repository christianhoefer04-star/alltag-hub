<title>Alltag Hub 1.6.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#0E0A1F; --bg2:#140E2B;
  --card:#1B1435; --card2:#221A40; --line:#2C2350; --line2:#3A2E66;
  --text:#F4F1FF; --dim:#9B93BD; --dim2:#6E6591; --dim3:#4A4270;
  --violet:#8B5CF6; --violet2:#A78BFA;
  --pink:#F43F8E; --cyan:#22D3EE; --lime:#A3E635; --amber:#FB923C;
  --good:#34D399; --bad:#FB7185;
  --train:#F43F8E; --budget:#22D3EE; --content:#A78BFA; --cal:#A3E635;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  overscroll-behavior-y:contain;-webkit-text-size-adjust:100%}
body::before{content:'';position:fixed;top:-180px;left:-120px;width:420px;height:420px;
  background:radial-gradient(circle,rgba(139,92,246,.28),transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-80px;right:-160px;width:380px;height:380px;
  background:radial-gradient(circle,rgba(244,63,142,.20),transparent 70%);pointer-events:none;z-index:0}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
#app{position:relative;z-index:1;max-width:600px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--violet),var(--pink));flex-shrink:0;color:#fff}
.topmeta{flex:1;min-width:0}
.topmeta .t1{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.topmeta .t2{font-size:11.5px;color:var(--dim);margin-top:2px}
.roundbtn{width:40px;height:40px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--dim);flex-shrink:0}

.subtabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.subtab{flex:0 0 auto;display:flex;align-items:center;gap:5px;border:1px solid var(--line);
  border-radius:11px;padding:9px 13px;font-size:12px;font-weight:700;background:var(--card);
  color:var(--dim);min-height:40px;white-space:nowrap}
.subtab.on{color:#fff;border-color:transparent}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.tile::after{content:'';position:absolute;right:-28px;top:-28px;width:76px;height:76px;border-radius:50%;opacity:.14}
.tile.v::after{background:var(--violet)} .tile.p::after{background:var(--pink)}
.tile.c::after{background:var(--cyan)} .tile.l::after{background:var(--lime)}
.tile-l{font-size:11px;color:var(--dim);font-weight:600;margin-bottom:8px;position:relative}
.tile-v{font-size:22px;font-weight:800;letter-spacing:-.02em;position:relative;line-height:1.1}
.tile-u{font-size:12px;font-weight:600;color:var(--dim)}
.tile-d{font-size:11px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;position:relative}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.panel-t{font-size:14.5px;font-weight:800}
.panel-s{font-size:11.5px;color:var(--dim);margin-bottom:12px}

.navcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.navicon{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.navtxt{flex:1;min-width:0}
.navtxt .a{font-size:14px;font-weight:800}
.navtxt .b{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.4}

.sec{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.09em;
  font-weight:700;margin:0 0 10px}

.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:12px 13px;margin-bottom:8px}
.row-n{font-weight:700;font-size:13.5px}
.row-m{font-size:11.5px;color:var(--dim2);margin-top:3px}
.grow{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.checkdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);
  background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.checkdot.on{background:var(--good,#34D399)!important;border-color:var(--good,#34D399)!important}
.amt{font-weight:800;font-size:14px;white-space:nowrap}

.iconbtn{background:none;border:none;color:var(--dim2);padding:9px;min-width:40px;min-height:40px;
  display:flex;align-items:center;justify-content:center;border-radius:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:14px;
  padding:14px 18px;font-weight:800;font-size:14px;width:100%;min-height:50px;color:#fff}
.btn.grad{background:linear-gradient(135deg,var(--violet),var(--pink))}
.btn.ghost{background:var(--card);border:1px solid var(--line2);color:var(--text)}
.btn.dash{background:transparent;border:1.5px dashed var(--line2);color:var(--dim);font-size:13px;min-height:46px}
.btn.sm{min-height:42px;padding:10px 14px;font-size:13px;border-radius:12px}
.addsq{border:none;border-radius:14px;width:44px;height:44px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 22px;
  border:1.5px dashed var(--line);border-radius:20px;color:var(--dim3)}
.empty p{color:var(--dim);font-size:13.5px;line-height:1.55;margin:12px 0 0;max-width:300px}
.empty2{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 24px;
  background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:14px}
.empty2-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.empty2-title{font-size:15px;font-weight:800;margin-bottom:6px}
.empty2-text{font-size:13px;color:var(--dim);line-height:1.55;max-width:280px}

.wcard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.whead{display:flex;align-items:center;padding:3px 5px 3px 12px}
.wheadbtn{flex:1;display:flex;align-items:center;gap:9px;background:none;border:none;padding:13px 0;text-align:left}
.wname{font-weight:800;font-size:14.5px}
.wcount{font-size:11px;color:var(--dim2);font-family:'JetBrains Mono',monospace}
.exlist{padding:0 12px 12px}
.exrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;
  font-weight:700;background:var(--card2);color:var(--dim);min-height:40px}
.hchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.hchips .chip{flex-shrink:0;white-space:nowrap}

.track{height:9px;background:var(--bg2);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .35s}
.bigval{font-size:26px;font-weight:800;letter-spacing:-.02em;display:block;margin:6px 0 12px}

.chartwrap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 12px 12px;margin-bottom:14px}

.loglist{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;
  padding:11px 2px;border-bottom:1px solid var(--line)}
.ldate{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim2)}
.lval{font-weight:700;font-size:13.5px}

svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;

svg.i.lg{width:22px;height:22px} svg.i.sm{width:14px;height:14px} svg.i.xs{width:12px;height:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;color:var(--dim2);font-size:10.5px;text-transform:uppercase;

 incomeEntries:[],expenses:[],items:[],bodyweight:[],goals:[],balances:[],
 habits:[],habitLog:[],tasks:[],
 meta:{lastExport:'',changes:0,onboarded:false},
 settings:{appName:'',modules:{training:true,budget:true,content:true,habitsTab:true},customCategories:{budget:[],training:[]},sync:{url:'',anonKey:''}}};

function normalizeState(d){
  if(typeof d.version==='number' && d.version>BLANK.version){
    setTimeout(()=>alert('Hinweis: Diese Daten wurden mit einer neueren Version der App gespeichert (Datenformat '+d.version+'). Manche neueren Felder werden hier eventuell nicht korrekt angezeigt, bis die App aktualisiert ist.'),400);
  }
  const n=Object.assign(JSON.parse(JSON.stringify(BLANK)),d);
  if(!n.meta)n.meta={lastExport:'',changes:0,onboarded:false};
  if(n.meta.onboarded===undefined)n.meta.onboarded=true;
  if(!n.settings)n.settings={appName:'',modules:{training:true,budget:true,content:true,habitsTab:true}};
  if(!n.settings.modules)n.settings.modules={training:true,budget:true,content:true,habitsTab:true};
  if(!n.settings.customCategories)n.settings.customCategories={budget:[],training:[]};
  if(!n.settings.sync)n.settings.sync={url:'',anonKey:''};
  if(n.meta.syncedAt===undefined)n.meta.syncedAt='';
  if(n.meta.dirty===undefined)n.meta.dirty=false;
  return n;
}
function boot(){
  const fill=normalizeState;
  // Ist Verschlüsselung eingerichtet, liegen die Daten nur verschlüsselt vor.
  // boot() liefert dann bewusst einen leeren Zustand: erst das Entsperren
  // (unlockAndLoad) füllt ihn. Die Klartext-Quellen werden gar nicht erst
  // gelesen - es dürfte dort auch nichts mehr liegen (siehe purgePlaintext).
  if(encryptionActive()) return JSON.parse(JSON.stringify(BLANK));
  try{ const raw=localStorage.getItem(KEY); if(raw) return fill(JSON.parse(raw)); }catch(e){}
  try{ const mir=localStorage.getItem(MIRROR);
    if(mir){ const d=fill(JSON.parse(mir));
      setTimeout(()=>alert('Der Hauptspeicher war beschädigt – deine Daten wurden aus der Sicherheitskopie wiederhergestellt.'),400);
      return d; } }catch(e){}
  try{ const old=localStorage.getItem(OLD); if(old) return migrate(JSON.parse(old)); }catch(e){}
  return JSON.parse(JSON.stringify(BLANK));
}
// Entsperren und Zustand laden. Erst wenn beides geklappt hat, wird S ersetzt -
// ein Fehler unterwegs lässt die App also im gesperrten Zustand stehen, statt
// sie mit halben Daten weiterlaufen zu lassen.
function unlockAndLoad(secret,which){
  return unlockWith(secret,which)
    .then(()=>loadEncrypted())
    .then(data=>{
      if(data===null){ S=JSON.parse(JSON.stringify(BLANK)); return S; }
      const next=(typeof data.version==='number'&&data.version===BLANK.version)?normalizeState(data):migrate(data);
      S=next;
      return S;
    })
    .catch(e=>{ lockNow(); throw e; });
}
function migrateV1toV2(d){
  const n=Object.assign(JSON.parse(JSON.stringify(BLANK)),d);
  n.version=2;
  (n.plan.workouts||[]).forEach(w=>(w.exercises||[]).forEach(ex=>{
    if(ex.targetSets===undefined){
      let s=3,r=8;
      const m=String(ex.target||'').match(/(\d+)\s*[x×]\s*(\d+)/);
      if(m){s=Number(m[1]);r=Number(m[2]);}
      ex.targetSets=s; ex.targetReps=r; ex.restSec=90;
    }
  }));
  (n.sessions||[]).forEach(s=>(s.entries||[]).forEach(e=>{
    if(!e.sets){
      const cat=TC[e.cat]?e.cat:'kraft';
      e.sets = TC[cat].mode==='sets' ? [{reps:null,weight:Number(e.value)||0}] : null;
      if(TC[cat].mode==='single') e.value=Number(e.value)||0;
    }
  }));
  (n.items||[]).forEach(i=>{ if(i.format===undefined) i.format='sonstiges';
    if(i.views===undefined) i.views=''; if(i.revenue===undefined) i.revenue=''; });
  (n.setup.fixedCosts||[]).forEach(f=>{ if(f.validFrom===undefined) f.validFrom=''; if(f.validTo===undefined) f.validTo=''; });
  (n.setup.income||[]).forEach(f=>{ if(f.validFrom===undefined) f.validFrom=''; if(f.validTo===undefined) f.validTo=''; });
  return n;

// Chain-friendly migration dispatcher: each future schema bump gets its own
// migrateVXtoVY() step added here, instead of rewriting one monolithic
// function every time. Anything left over that this code doesn't recognize
// falls back to a defensive normalize-against-BLANK rather than a guess.
function migrate(d){
  let n=d;
  if(!n.version || n.version===1) n=migrateV1toV2(n);
  // if(n.version===2) n=migrateV2toV3(n);  // <- next schema bump goes here
  if(n.version!==BLANK.version){
    n=Object.assign(JSON.parse(JSON.stringify(BLANK)),n);
    n.version=BLANK.version;
  }
  return n;
}
/* ===================== SPEICHERPFAD (Klartext ODER verschlüsselt) =========
 * Die App kann in zwei Betriebsarten laufen:
 *
 *   a) Klartext  - wie bisher, KEY/MIRROR enthalten JSON. Gilt, solange kein
 *                  Umschlag (ENVKEY) existiert.
 *   b) Verschlüsselt - ENVKEY enthält den Umschlag (nicht geheim: nur Salts
 *                  und die eingepackten Schlüssel), ENCKEY den Chiffretext.
 *
 * Die Betriebsart ergibt sich allein daraus, ob ein Umschlag vorliegt. So
 * bleibt der bestehende Klartext-Pfad unangetastet, bis die Migration ihn
 * bewusst umstellt - und ein Fehler in der Verschlüsselung kann niemanden
 * treffen, der sie nie aktiviert hat.
 *
 * Wichtig und bewusst in Kauf genommen: Verschlüsseln ist asynchron. Ein
 * Schreibvorgang, der beim Schliessen des Tabs noch läuft, kann verloren
 * gehen - anders als beim synchronen Klartext-Schreiben. Deshalb ist das
 * Zeitfenster kurz gehalten (siehe save()) und beim Verlassen wird zusätzlich
 * sofort geschrieben.
 */
function storedEnvelope(){
  try{ const raw=localStorage.getItem(ENVKEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function encryptionActive(){ return !!storedEnvelope(); }
function isLocked(){ return encryptionActive() && !DEK; }
function storeEnvelope(env){
  try{ localStorage.setItem(ENVKEY,JSON.stringify(env)); return true; }
  catch(e){ return false; }
}
// Entsperren: Umschlag + Geheimnis -> DEK im Speicher. Danach liefert
// loadEncrypted() den Zustand. Schlägt fehl bei falschem Passwort/Code.
function unlockWith(secret,which){
  const env=storedEnvelope();
  if(!env) return Promise.reject(new Error('Für dieses Gerät ist keine Verschlüsselung eingerichtet.'));
  return openEnvelope(env,secret,which).then(dek=>{ DEK=dek; return dek; });
}
function lockNow(){ DEK=null; }
function loadEncrypted(){
  if(!DEK) return Promise.reject(new Error('Noch nicht entsperrt.'));
  let blob=null;
  try{ const raw=localStorage.getItem(ENCKEY); if(raw) blob=JSON.parse(raw); }catch(e){}
  if(!blob){
    try{ const raw=localStorage.getItem(ENCMIRROR); if(raw) blob=JSON.parse(raw); }catch(e){}
  }
  if(!blob) return Promise.resolve(null);
  return decryptState(DEK,blob);
}
function saveEncrypted(state){
  if(!DEK) return Promise.reject(new Error('Noch nicht entsperrt.'));
  return encryptState(DEK,state).then(blob=>{
    const j=JSON.stringify(blob);
    localStorage.setItem(ENCKEY,j);
    try{ localStorage.setItem(ENCMIRROR,j); }catch(e){}
    return true;
  });
}
// Beim Umstellen auf Verschlüsselung: Klartext-Reste entfernen. Sonst läge
// weiterhin eine vollständige, offene Kopie daneben und die ganze Übung wäre
// wirkungslos.
function purgePlaintext(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ localStorage.removeItem(MIRROR); }catch(e){}
  try{ localStorage.removeItem(OLD); }catch(e){}
  try{ localStorage.removeItem(SYNCBASE); }catch(e){}
}

let U={tab:'home',ts:'plan',bs:'overview',cs:'board',month:mk(new Date()),
 sel:null,prog:null,metric:'top',exp:{},modal:null,draft:null,keep:0};
let fT=null;
let saveTimer=null;
function flushWrite(){
  saveTimer=null;
  try{
    if(encryptionActive()){
      if(!DEK) return;                       // gesperrt: nichts schreiben
      // Gibt die laufende Schreibzusage zurück, damit Aufrufer (und Tests) auf
      // den Abschluss warten können, statt auf gut Glück einen Zeitgeber zu
      // nehmen. Auf einen Zeitgeber zu warten ergibt schwankende Tests.
      return saveEncrypted(S).catch(e=>{ alert('Speichern nicht möglich: '+(e.message||e)); });
    }
    const j=JSON.stringify(S);
    localStorage.setItem(KEY,j);
    try{ localStorage.setItem(MIRROR,j); }catch(e){}
  }catch(e){ alert('Speichern nicht möglich: '+e.message); }
}
function save(){
  try{
    if(!S.meta)S.meta={lastExport:'',changes:0};
    S.meta.changes=(S.meta.changes||0)+1;
    S.meta.dirty=true;
    if(typeof scheduleAutoSync==='function') scheduleAutoSync();
    // Schreibvorgänge bündeln, statt bei jedem Tastendruck den kompletten
    // Zustand neu zu serialisieren. Beim Verstecken/Schliessen wird sofort
    // geschrieben, damit nichts verloren geht.
    //
    // Bei aktiver Verschlüsselung ist das Fenster kürzer: Verschlüsseln ist
    // asynchron, ein beim Schliessen noch laufender Schreibvorgang kann also -
    // anders als im Klartextbetrieb - abbrechen. Ganz ausschliessen lässt sich
    // das im Browser nicht; das Fenster wird deshalb klein gehalten. Das
    // Verschlüsseln selbst dauert für diese Datenmengen deutlich unter einer
    // Millisekunde, der Verlust wäre also höchstens die allerletzte Änderung.
    clearTimeout(saveTimer); saveTimer=setTimeout(flushWrite,encryptionActive()?120:400);
    const f=document.getElementById('flash'); f.classList.add('show','pop');
    clearTimeout(fT); fT=setTimeout(()=>f.classList.remove('show','pop'),1000);
  }catch(e){ alert('Speichern nicht möglich: '+e.message); }
}
function flushSaveNow(){ if(saveTimer){ clearTimeout(saveTimer); flushWrite(); } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSaveNow(); });
window.addEventListener('pagehide',flushSaveNow);
function backupStatus(){
  const m=S.meta||{};
  const ch=m.changes||0;
  if(!m.lastExport) return {due:ch>=8,days:null,changes:ch,
    text:ch>=8?'Du hast noch nie gesichert – '+ch+' Änderungen sind ungesichert.':''};
  const days=Math.floor((new Date(today())-new Date(m.lastExport))/86400000);
  const due=ch>=25||days>=14;
  return {due:due,days:days,changes:ch,
    text:due?('Letzte Sicherung vor '+days+' Tagen · '+ch+' Änderungen seitdem'):''};
}

function area(data,color,fmt){
  if(!data.length) return '<p style="color:var(--dim2);font-size:12.5px;padding:8px 4px">Keine Daten</p>';
  const W=340,H=190,PL=40,PR=12,PT=14,PB=26; const id='g'+(++gid);
  const v=data.map(d=>d.value); let mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);
  if(mn===mx){mn=mn-1;mx=mx+1;} const pd=(mx-mn)*.12; mn-=pd; mx+=pd; if(mn<0&&Math.min.apply(null,v)>=0) mn=0;
  const px=i=>data.length===1?PL+(W-PL-PR)/2:PL+i*(W-PL-PR)/(data.length-1);
  const py=x=>PT+(1-(x-mn)/(mx-mn))*(H-PT-PB);
  let p='',ar=''; data.forEach((d,i)=>{p+=(i?' L':'M')+px(i).toFixed(1)+' '+py(d.value).toFixed(1);});
  ar=p+' L'+px(data.length-1).toFixed(1)+' '+(H-PB)+' L'+px(0).toFixed(1)+' '+(H-PB)+' Z';
  let g='',lb='';
  for(let k=0;k<=3;k++){const y=PT+k*(H-PT-PB)/3;const val=mx-(k*(mx-mn)/3);
    g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#2C2350" stroke-width="1"/>';
    lb+='<text x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" fill="#6E6591" font-size="9" text-anchor="end" font-family="monospace">'+(fmt?fmt(val):Math.round(val*10)/10)+'</text>';}
  let dots=''; const mxv=Math.max.apply(null,v);
  data.forEach((d,i)=>{dots+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(d.value).toFixed(1)+'" r="'+(d.value===mxv?4.5:2.8)+'" fill="'+(d.value===mxv?LIME:color)+'" stroke="#1B1435" stroke-width="1.5"/>';});
  let xl=''; const st=Math.max(1,Math.ceil(data.length/5));
  data.forEach((d,i)=>{if(i%st===0||i===data.length-1)
    xl+='<text x="'+px(i).toFixed(1)+'" y="'+(H-7)+'" fill="#6E6591" font-size="8.5" text-anchor="middle" font-family="monospace">'+esc(d.label)+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
   '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
   '<stop offset="0%" stop-color="'+color+'" stop-opacity=".38"/>'+
   '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
   g+'<path d="'+ar+'" fill="url(#'+id+')"/>'+
   '<path d="'+p+'" fill="none" stroke="'+color+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'+
   dots+lb+xl+'</svg>';
}
function bars(data,color,line,fmt){
  if(!data.length) return '';
  const W=340,H=190,PL=44,PR=12,PT=14,PB=26;
  const v=data.map(d=>d.value).concat(line?[line]:[]);
  const mx=Math.max.apply(null,v.concat([1]))*1.18;
  const bw=(W-PL-PR)/data.length; let b='',xl='';
  data.forEach((d,i)=>{const h=(d.value/mx)*(H-PT-PB);const x=PL+i*bw+bw*.2;const w=bw*.6;
    const col=d.color||color;
    b+='<rect x="'+x.toFixed(1)+'" y="'+(H-PB-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,2).toFixed(1)+'" rx="5" fill="'+col+'"/>';
    xl+='<text x="'+(PL+i*bw+bw/2).toFixed(1)+'" y="'+(H-7)+'" fill="#6E6591" font-size="9" text-anchor="middle" font-family="monospace">'+esc(d.label)+'</text>';});
  let g='',lb='';
  for(let k=0;k<=3;k++){const y=PT+k*(H-PT-PB)/3;const val=mx-(k*mx/3);
    g+='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#2C2350" stroke-width="1"/>';
    lb+='<text x="'+(PL-7)+'" y="'+(y+3.5).toFixed(1)+'" fill="#6E6591" font-size="9" text-anchor="end" font-family="monospace">'+(fmt?fmt(val):Math.round(val))+'</text>';}
  let ln='';
  if(line){const y=PT+(1-line/mx)*(H-PT-PB);
    ln='<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="'+LIME+'" stroke-width="1.6" stroke-dasharray="5 4"/>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+b+ln+lb+xl+'</svg>';
}

function streak(){
  const s=new Set();
  S.sessions.forEach(x=>s.add(x.date));
  S.items.forEach(i=>{ if(i.status==='fertig'&&i.date) s.add(i.date); });
  S.habitLog.forEach(l=>s.add(l.date));
  let n=0;const c=new Date();
  if(!s.has(isoOf(c)))c.setDate(c.getDate()-1);
  while(s.has(isoOf(c))){n++;c.setDate(c.getDate()-1);}
  return n;
}
const PRIO={muss:{label:'Muss',color:'#F43F8E'},soll:{label:'Soll',color:'#FB923C'},nice:{label:'Nice',color:'#6E6591'}};
const PRIO_ORDER=['muss','soll','nice'];
function todayHabits(){
  const wd=wdOf(today());
  return S.habits.filter(h=>!h.weekdays||!h.weekdays.length||h.weekdays.includes(wd));
}
function isHabitDone(id){ return S.habitLog.some(l=>l.habitId===id&&l.date===today()); }
function toggleHabit(id){
  const t=today();
  const idx=S.habitLog.findIndex(l=>l.habitId===id&&l.date===t);
  if(idx>=0) S.habitLog.splice(idx,1); else S.habitLog.push({id:uid(),habitId:id,date:t});
}
function openTasks(){
  const t=today();
  return S.tasks.filter(x=>!x.done&&x.date<=t)
    .sort((a,b)=>PRIO_ORDER.indexOf(a.priority)-PRIO_ORDER.indexOf(b.priority)||a.date.localeCompare(b.date));
}
function habitScheduled(hb,dateIso){
  if(!hb.weekdays||!hb.weekdays.length) return true;
  return hb.weekdays.includes(wdOf(dateIso));
}
function habitDoneOn(id,dateIso){ return S.habitLog.some(l=>l.habitId===id&&l.date===dateIso); }
function habitStreak(id){
  const hb=S.habits.find(x=>x.id===id); if(!hb) return 0;
  let n=0; const c=new Date(); let guard=0; const t=today();
  while(guard<730){
    const iso=isoOf(c);
    if(habitScheduled(hb,iso)){
      if(habitDoneOn(id,iso)) n++;
      else if(iso!==t) break;
    }
    c.setDate(c.getDate()-1); guard++;
  }
  return n;
}
function habitWeek(id){
  const hb=S.habits.find(x=>x.id===id);
  const out=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const iso=isoOf(d);
    out.push({date:iso,label:WD[(d.getDay()+6)%7],scheduled:hb?habitScheduled(hb,iso):false,done:habitDoneOn(id,iso)});
  }
  return out;
}
function volumeOf(entry){
  if(!entry.sets) return 0;
  return entry.sets.reduce((a,st)=>a+(Number(st.reps)||0)*(Number(st.weight)||0),0);
}
function monthIncome(m){
  const rec=S.setup.income.filter(i=>activeIn(i,m)).reduce((a,b)=>a+Number(b.amount||0),0);
  const varI=S.incomeEntries.filter(i=>i.date.slice(0,7)===m).reduce((a,b)=>a+Number(b.amount||0),0);
  return rec+varI;
}
function monthFixed(m){ return S.setup.fixedCosts.filter(f=>activeIn(f,m)).reduce((a,b)=>a+monthlyOf(b),0); }
function monthSpent(m){ return S.expenses.filter(e=>e.date.slice(0,7)===m).reduce((a,b)=>a+Number(b.amount||0),0); }

function sortedSessions(){
  // Sessions can be backdated by the user, so array-insertion order is not
  // reliable as "most recent first". Sort a copy by date (stable sort keeps
  // same-day entries in their original logged order).
  return S.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date));
}
function lastEntryFor(exId){
  const ss=sortedSessions();
  for(let i=ss.length-1;i>=0;i--){
    const s=ss[i];
    const e=s.entries.find(x=>x.exerciseId===exId);
    if(e) return {entry:e,date:s.date};
  }
  return null;
}
function historyFor(exId,n){
  const out=[];
  const ss=sortedSessions();
  for(let i=ss.length-1;i>=0&&out.length<n;i--){
    const s=ss[i];
    const e=s.entries.find(x=>x.exerciseId===exId);
    if(e) out.unshift({entry:e,date:s.date});
  }
  return out;
}
function topOf(e){ return e.sets&&e.sets.length?Math.max.apply(null,e.sets.map(s=>Number(s.weight)||0)):0; }
function hitTarget(e,ex){
  const tS=Number(ex.targetSets)||3, tR=Number(ex.targetReps)||8;
  const sets=e.sets||[];
  return sets.filter(s=>(Number(s.reps)||0)>=tR).length>=tS;
}
function round25(v){ return Math.round(v*2)/2; }
function suggestFor(ex){
  const c=tcOf(ex.cat);
  const hist=historyFor(ex.id,3);
  if(!hist.length) return null;
  const last=hist[hist.length-1];

  if(c.mode==='single'){
    const v=Number(last.entry.value)||0;
    return {text:'Letztes Mal '+v+' '+esc(c.unit)+' ('+fmtD(last.date)+')',value:v,tone:'n'};
  }

  const tS=Number(ex.targetSets)||3, tR=Number(ex.targetReps)||8;
  const top=topOf(last.entry);
  const desc=(last.entry.sets||[]).map(s=>(s.reps!=null?s.reps:'–')+'×'+(s.weight||0)).join(', ');
  const done=hitTarget(last.entry,ex);
  const rpe=last.entry.rpe||'';
  const bodyweight=top===0;

  // zwei Einheiten in Folge Ziel verfehlt -> Deload
  if(hist.length>=2 && !done && !hitTarget(hist[hist.length-2].entry,ex)){
    const w=bodyweight?0:round25(top*0.9);
    return {text:'Zweimal das Ziel verfehlt ('+desc+'). Deload: '+(bodyweight?'Wiederholungen reduzieren und sauber aufbauen':'runter auf '+w+' '+esc(c.unit)+' und neu aufbauen')+'.',
      weight:bodyweight?'':w,reps:tR,tone:'d',deload:true};
  }

  // Plateau: seit 3 Einheiten kein Fortschritt
  if(hist.length>=3){
    const tops=hist.map(h=>topOf(h.entry));
    const vols=hist.map(h=>(h.entry.sets||[]).reduce((a,s)=>a+(Number(s.reps)||0)*(Number(s.weight)||0),0));
    const noProgress=tops[2]<=tops[0] && vols[2]<=vols[0];
    if(noProgress){
      if(done) return {text:'Seit drei Einheiten dasselbe Niveau. Statt mehr Gewicht: eine Wiederholung mehr pro Satz ('+(tR+1)+' statt '+tR+') bei '+top+' '+esc(c.unit)+'.',
        weight:bodyweight?'':top,reps:tR+1,tone:'p'};
      const w=bodyweight?0:round25(top*0.9);
      return {text:'Plateau seit drei Einheiten und Ziel nicht erreicht. Deload auf '+(bodyweight?'weniger Wiederholungen':w+' '+esc(c.unit))+', dann sauber steigern.',
        weight:bodyweight?'':w,reps:tR,tone:'d',deload:true};
    }
  }

  // Ziel erreicht -> Steigerung nach Anstrengung
  if(done){
    if(bodyweight) return {text:'Ziel erreicht ('+desc+'). Nächster Schritt: '+(tR+ (rpe==='leicht'?2:1))+' Wiederholungen pro Satz.',
      weight:'',reps:tR+(rpe==='leicht'?2:1),tone:'u'};
    let inc = rpe==='leicht' ? 5 : rpe==='schwer' ? 1.25 : 2.5;
    const w=round25(top+inc);
    const why = rpe==='leicht' ? 'war leicht – größerer Sprung'
      : rpe==='schwer' ? 'war schwer – kleiner Schritt'
      : 'Ziel erreicht';
    return {text:why+' ('+desc+'). Heute '+w+' '+esc(c.unit)+' versuchen.',weight:w,reps:tR,tone:'u'};
  }

  // Ziel knapp verfehlt -> Gewicht halten
  return {text:'Letztes Mal '+desc+' – Ziel '+tS+'×'+tR+' noch offen. Nochmal '+(bodyweight?'sauber wiederholen':top+' '+esc(c.unit))+'.',
    weight:bodyweight?'':top,reps:tR,tone:'n'};
}

function metricOf(entry,metric,cat){
  const c=tcOf(cat);
  if(c.mode==='single'||!entry.sets) return Number(entry.value)||0;
  const sets=entry.sets||[];
  if(!sets.length) return 0;
  if(metric==='vol') return sets.reduce((a,s)=>a+(Number(s.reps)||0)*(Number(s.weight)||0),0);
  if(metric==='e1rm') return Math.max.apply(null,sets.map(s=>s.reps?e1rm(s.weight,s.reps):Number(s.weight)||0));
  return Math.max.apply(null,sets.map(s=>Number(s.weight)||0));
}
function planExById(id){

function tProg(){
  const all=[];

  all.sort((a,b)=>a.date.localeCompare(b.date));
  const keys=[];const seen={};
  all.forEach(e=>{
    const k=e.exerciseId||('n:'+e.cat+'::'+e.name);
    const pe=e.exerciseId?planExById(e.exerciseId):null;
    if(!seen[k]){ seen[k]={key:k,name:pe?pe.name:e.name,cat:pe?pe.cat:e.cat,gone:!pe&&!!e.exerciseId};
      keys.push(seen[k]); }
    else if(!pe){ seen[k].name=e.name; seen[k].cat=e.cat; }
  });
  if(!keys.length)return emptyState('trend',PINK,'Noch kein Fortschritt','Sobald du dein erstes Training loggst, siehst du hier Verlauf, Bestwerte und Zielfortschritt.','Training loggen','data-ts="log"');
  if(!U.prog||!keys.find(k=>k.key===U.prog))U.prog=keys[0].key;
  const sel=keys.find(k=>k.key===U.prog);const c=tcOf(sel.cat);
  const isSets=c.mode==='sets';
  if(!isSets) U.metric='top';
  const data=all.filter(e=>(e.exerciseId||('n:'+e.cat+'::'+e.name))===U.prog)
    .map(e=>({date:e.date,label:fmtDS(e.date),value:Math.round(metricOf(e,U.metric,sel.cat)*10)/10,entry:e}));
  const v=data.map(d=>d.value);const mx=Math.max.apply(null,v);
  const pr=data.find(d=>d.value===mx);const last=data[data.length-1];const first=data[0];
  const delta=data.length>1?last.value-first.value:0;
  const unit=U.metric==='vol'?'kg vol':c.unit;
  const planEx=sel.key.indexOf('n:')===0?null:planExById(sel.key);

  const sq=(U.searchProg||'').toLowerCase().trim();
  const visibleKeys=sq?keys.filter(k=>k.name.toLowerCase().includes(sq)):keys;

function tWeight(){
  const s=S.bodyweight.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const data=s.map(b=>({date:b.date,label:fmtDS(b.date),value:Number(b.value)}));
  let h='<div style="display:flex;gap:8px;margin-bottom:16px">'+
   '<input class="f" id="bwV" type="number" step="any" inputmode="decimal" placeholder="Gewicht (kg)">'+
   '<input class="f" id="bwD" type="date" value="'+today()+'">'+
   '<button class="addsq" data-abw="1">'+ic('plus')+'</button></div>';
  if(!data.length)return h+emptyState('scale',PINK,'Noch kein Gewicht erfasst','Trag oben deinen ersten Wert ein, um deinen Verlauf über Zeit zu sehen.',null,null);
  const last=data[data.length-1],first=data[0];
  const d7=data.filter(x=>{const dd=new Date(x.date+'T00:00:00');const c=new Date();c.setDate(c.getDate()-7);return dd>=c;});
  const avg7=d7.length?d7.reduce((a,b)=>a+b.value,0)/d7.length:last.value;

  h+='<div class="tiles">'+
   tile('p','Aktuell',last.value,'kg',fmtD(last.date),'#6E6591')+
   tile('v','Ø 7 Tage',Math.round(avg7*10)/10,'kg','','')+
   tile('c','Gesamt',(delta>0?'+':'')+(Math.round(delta*10)/10),'kg','seit Start',delta<0?GOOD:(delta>0?BAD:'#6E6591'))+
   tile('l','Messungen',data.length,'','','#6E6591')+'</div>';
  h+='<div class="chartwrap">'+area(data,LIME,x=>Math.round(x*10)/10)+'</div>';

   '<div class="lrow"><div class="ldate">'+fmtD(b.date)+'</div><div class="lval">'+b.value+' kg</div>'+

function vBudget(){
  const list=[{k:'overview',l:'Übersicht',i:'grid'},{k:'income',l:'Einnahmen',i:'euro'},
   {k:'fixed',l:'Fixkosten',i:'wallet'},{k:'expenses',l:'Ausgaben',i:'receipt'},
   {k:'balance',l:'Abgleich',i:'layers'},{k:'goals',l:'Sparziele',i:'piggy'},
   {k:'trend',l:'Verlauf',i:'chart'}];
  let b='';
  if(U.bs==='overview')b=bOverview(); else if(U.bs==='income')b=bIncome();
  else if(U.bs==='fixed')b=bFixed(); else if(U.bs==='expenses')b=bExp();

function bOverview(){
  const m=U.month;
  const inc=monthIncome(m),fix=monthFixed(m),sp=monthSpent(m);
  const avail=inc-fix,rem=avail-sp;
  const pct=avail>0?Math.min(100,(sp/avail)*100):(sp>0?100:0);
  const over=rem<0;
  const me=S.expenses.filter(e=>e.date.slice(0,7)===m);
  const map={};me.forEach(e=>{map[e.category]=(map[e.category]||0)+Number(e.amount||0);});
  const cats=allBCO().filter(c=>map[c]).sort((a,b)=>map[b]-map[a]);
  let h=mNav()+'<div class="tiles">'+
   tile('l','Einnahmen',eur(inc),'','','')+
   tile('v','Fixkosten',eur(fix),'','','')+
   tile('p','Ausgaben',eur(sp),'','','')+
   tile('c','Sparrate',(inc>0?Math.round((rem/inc)*100):0)+'%','',rem>0?'vom Einkommen':'negativ',rem>0?GOOD:BAD)+
   '</div>';
  h+='<div class="panel"><div class="panel-h"><span class="panel-t">'+(over?'Überzogen um':'Verbleibendes Budget')+'</span></div>'+
   '<span class="bigval" style="color:'+(over?BAD:CYAN)+'">'+eur2(Math.abs(rem))+'</span>'+
   '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+(over?'linear-gradient(90deg,'+AMBER+','+BAD+')':'linear-gradient(90deg,'+VIOLET+','+CYAN+')')+'"></div></div>'+
   '<div class="panel-s" style="margin:9px 0 0">'+eur2(sp)+' von '+eur2(avail)+' frei verfügbar ausgegeben</div></div>';
  if(cats.length){
    h+='<div class="sec">Ausgaben nach Kategorie</div>';
    cats.forEach(k=>{const c=bcOf(k);const p=sp>0?(map[k]/sp)*100:0;
      h+='<div class="panel" style="padding:13px;margin-bottom:8px">'+
       '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'+
       '<span style="display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700"><span class="dot" style="background:'+COL(c.color)+'"></span>'+esc(c.label)+'</span>'+
       '<span style="font-size:13px;font-weight:800">'+eur2(map[k])+'</span></div>'+
       '<div class="track" style="height:6px"><div class="fill" style="width:'+p+'%;background:'+COL(c.color)+'"></div></div></div>';});
  }
  return h;
}

function motivation(st,rem,due){
  if(st>=7) return 'Starke '+st+' Tage in Folge – dranbleiben.';
  if(st>=1) return st+' Tag'+(st===1?'':'e')+' in Folge aktiv – weiter so.';

/* ============ KONTOABGLEICH ============ */
function monthsBetween(d0,d1){
  const out=[];
  const a=new Date(d0+'T00:00:00'), b=new Date(d1+'T00:00:00');
  const c=new Date(a.getFullYear(),a.getMonth(),1);
  while(c<=b){ const first=isoOf(c); if(first>d0&&first<=d1) out.push(mk(c)); c.setMonth(c.getMonth()+1); }
  return out;
}
function trackedChange(d0,d1){
  let inc=S.incomeEntries.filter(e=>e.date>d0&&e.date<=d1).reduce((a,b)=>a+Number(b.amount||0),0);
  let exp=S.expenses.filter(e=>e.date>d0&&e.date<=d1).reduce((a,b)=>a+Number(b.amount||0),0);
  monthsBetween(d0,d1).forEach(m=>{
    inc+=S.setup.income.filter(i=>activeIn(i,m)).reduce((a,b)=>a+Number(b.amount||0),0);
    exp+=S.setup.fixedCosts.filter(f=>activeIn(f,m)).reduce((a,b)=>a+monthlyOf(b),0);
  });
  return {inc:inc,exp:exp,net:inc-exp};
}
function lastBalance(before){
  const l=S.balances.filter(b=>!before||b.date<=before).sort((a,b)=>a.date.localeCompare(b.date));
  return l.length?l[l.length-1]:null;
}
function reconcile(amount,date){
  const last=lastBalance(date);
  if(!last) return {first:true,amount:amount,date:date};
  const actual=amount-Number(last.amount);
  const tc=trackedChange(last.date,date);
  return {first:false,amount:amount,date:date,last:last,actual:actual,
    tracked:tc.net,inc:tc.inc,exp:tc.exp,delta:Math.round((actual-tc.net)*100)/100};
}

/* ===================== UNDO ===================== */
// Stack of independent full-state snapshots, each with its own 9s expiry.
// A second delete no longer silently forfeits the ability to undo the first
// one - every pending action gets its own window. "Rückgängig" always pops
// the most recent action first (standard LIFO undo behaviour); undoing an
// older one necessarily also reverts anything done after it, since that
// later work was built on top of the state being restored.
const UN_TTL=9000;
let UN=[];
function withUndo(label,fn){
  const entry={id:uid(),snap:JSON.stringify(S),label:label,t:null};
  entry.t=setTimeout(()=>{ expireUndo(entry.id); },UN_TTL);
  UN.push(entry);
  fn(); commit();
}
function expireUndo(id){
  const i=UN.findIndex(x=>x.id===id);
  if(i>=0){ UN.splice(i,1); renderUndo(); }
}
function doUndo(){
  const entry=UN.pop();
  if(!entry) return;
  clearTimeout(entry.t);
  S=JSON.parse(entry.snap);
  U.draft=null; save(); render();
}
function renderUndo(){
  const el=document.getElementById('undo');
  if(!el) return;
  if(!UN.length){ el.innerHTML=''; return; }
  const top=UN[UN.length-1];
  const more=UN.length-1;
  const up=T.int?1:0;
  el.innerHTML='<div class="undobar" style="bottom:calc('+(up?142:78)+'px + env(safe-area-inset-bottom))">'+
   ic('trash','sm')+'<span class="ul">'+esc(top.label)+' gelöscht'+(more>0?' · +'+more+' weitere rückgängig machbar':'')+'</span>'+
   '<button data-undo="1">Rückgängig</button></div>';
}

let T={left:0,int:null,name:''};
function startTimer(sec,name){
  stopTimer(); T.left=sec; T.name=name;
  T.int=setInterval(()=>{ T.left--; if(T.left<=0){ beep(); stopTimer(); } renderTimer(); },1000);
  renderTimer();
}
function stopTimer(){ if(T.int){clearInterval(T.int);T.int=null;} T.left=0; renderTimer(); }
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator(),g=a.createGain(); o.connect(g);g.connect(a.destination);
  o.frequency.value=880; g.gain.setValueAtTime(.25,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5); o.start(); o.stop(a.currentTime+.5);
 }catch(e){} if(navigator.vibrate) try{navigator.vibrate([200,80,200]);}catch(e){} }
function renderTimer(){
  const el=document.getElementById('timer');
  setTimeout(renderUndo,0);
  if(!T.int){ el.innerHTML=''; return; }
  const m=Math.floor(T.left/60),s=T.left%60;

/* ===================== CSV IMPORT (Ausgaben) ===================== */
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const firstLine=(text.split(/\r\n|\n|\r/)[0]||'');
  const semi=(firstLine.match(/;/g)||[]).length;
  const comma=(firstLine.match(/,/g)||[]).length;
  const delim=semi>=comma?';':',';
  const rows=[];
  let i=0,field='',row=[],inQuotes=false;
  while(i<text.length){
    const ch=text[i];
    if(inQuotes){
      if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=ch; i++; continue;
    }
    if(ch==='"'){ inQuotes=true; i++; continue; }
    if(ch===delim){ row.push(field); field=''; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=ch; i++;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1&&r[0].trim()===''));
}
function parseCsvDate(s){
  s=String(s||'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  return null;
}
function parseCsvAmount(s){
  s=String(s||'').trim().replace(/[€\s]/g,'');
  if(!s) return null;
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/,/g,'');
  const n=Number(s);
  return isNaN(n)?null:n;
}
function looksLikeCsvHeader(row){
  const joined=row.join(' ').toLowerCase();
  return /datum|date|bezeichnung|name|kategorie|category|betrag|amount/.test(joined) && parseCsvDate(row[0])===null;
}
function parseExpenseCsv(text){
  const rows=parseCsv(text);
  if(!rows.length) return [];
  let start=looksLikeCsvHeader(rows[0])?1:0;
  const out=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i];
    if(!r.length||(r.length===1&&!r[0].trim())) continue;
    const date=parseCsvDate(r[0]);
    const name=(r[1]||'').trim();
    const category=(r[2]||'').trim();
    const amount=parseCsvAmount(r[3]);
    out.push({date:date,name:name,category:category,amount:amount,valid:!!(date&&name&&amount!=null)});
  }
  return out;
}

/* ===================== CRYPTO (lokale Verschlüsselung) =====================
 * Zweistufig ("envelope encryption"), bewusst nicht direkt Passwort -> Daten:
 *
 *   Passwort --PBKDF2--> KEK  --verschlüsselt-->  DEK  --verschlüsselt--> Daten
 *
 * Der DEK ist ein zufälliger Schlüssel und verschlüsselt den eigentlichen
 * Zustand. Das Passwort verschlüsselt nur den DEK. Folge: ein Passwortwechsel
 * packt ausschliesslich den DEK neu ein - die (potenziell grossen) Daten
 * müssen nicht angefasst werden, und ältere Backups bleiben lesbar.
 *
 * Ohne Passwort sind die Daten nicht wiederherstellbar. Das ist der Sinn der
 * Sache und ausdrücklich kein Fehler - es gibt keine Hintertür und keinen
 * Reset. Deshalb erzwingt die App vor dem Aktivieren ein Klartext-Backup.
 *
 * Alles hier ist frei von Seiteneffekten und arbeitet nur auf übergebenen
 * Werten, damit es testbar bleibt (siehe "Crypto" in tests/logic.test.js).
 */
const KDF_ITER=310000;           // OWASP-Empfehlung für PBKDF2-SHA256
const CRYPTO_VERSION=1;          // Format-Version des Umschlags, separat vom Datenschema
function subtle(){
  const c=(typeof crypto!=='undefined'&&crypto)||null;
  if(!c||!c.subtle) throw new Error('Dieser Browser unterstützt die nötige Verschlüsselung nicht (WebCrypto fehlt).');
  return c.subtle;
}
function randBytes(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function b64(bytes){ let s=''; const a=new Uint8Array(bytes); for(let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
function unb64(str){ const s=atob(String(str||'')); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function utf8(str){ return new TextEncoder().encode(str); }
function unutf8(bytes){ return new TextDecoder().decode(bytes); }

// Passwort -> KEK. Der Salt gehört zum Umschlag und darf offen daneben liegen;
// er verhindert nur, dass sich vorberechnete Tabellen wiederverwenden lassen.
function deriveKEK(password,saltBytes,iter){
  return subtle().importKey('raw',utf8(String(password)),{name:'PBKDF2'},false,['deriveKey'])
    .then(base=>subtle().deriveKey(
      {name:'PBKDF2',salt:saltBytes,iterations:iter||KDF_ITER,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']));
}
function aesEncrypt(key,bytes){
  const iv=randBytes(12);
  return subtle().encrypt({name:'AES-GCM',iv:iv},key,bytes)
    .then(ct=>({iv:b64(iv),ct:b64(ct)}));
}
function aesDecrypt(key,ivB64,ctB64){
  return subtle().decrypt({name:'AES-GCM',iv:unb64(ivB64)},key,unb64(ctB64));
}

// Der DEK kann mehrfach eingepackt werden - einmal pro Geheimnis. Passwort und
// Wiederherstellungscode öffnen so dieselben Daten, ohne voneinander zu wissen.
// Genau das entschärft den gefährlichsten Fall: Passwort vergessen == alles weg.
function wrapDek(dekRaw,secret){
  const salt=randBytes(16);
  return deriveKEK(secret,salt).then(kek=>aesEncrypt(kek,dekRaw).then(w=>
    ({kdf:'PBKDF2-SHA256',iter:KDF_ITER,salt:b64(salt),iv:w.iv,ct:w.ct})));
}
function unwrapDek(slot,secret){
  return deriveKEK(secret,unb64(slot.salt),slot.iter)
    .then(kek=>aesDecrypt(kek,slot.iv,slot.ct));
}
// Menschlich abschreibbarer Code: keine leicht verwechselbaren Zeichen
// (0/O, 1/I/L), in Blöcken, damit man ihn realistisch auf Papier notieren kann.
function makeRecoveryCode(){
  const alpha='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const bytes=randBytes(20);
  let out='';

function normalizeRecoveryCode(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

// die App ihn genau einmal anzeigen kann - gespeichert wird er nirgends.
function createEnvelope(password){
  const dekRaw=randBytes(32);
  const recovery=makeRecoveryCode();
  return Promise.all([wrapDek(dekRaw,password),wrapDek(dekRaw,normalizeRecoveryCode(recovery))])
    .then(([pwSlot,recSlot])=>
      subtle().importKey('raw',dekRaw,{name:'AES-GCM'},false,['encrypt','decrypt']).then(dek=>({
        envelope:{v:CRYPTO_VERSION,slots:{password:pwSlot,recovery:recSlot}},

  if(envelope.v>CRYPTO_VERSION) return Promise.reject(new Error('Die Daten wurden mit einer neueren App-Version verschlüsselt. Bitte zuerst die App aktualisieren.'));
  const kind=which||'password';

  if(!slot) return Promise.reject(new Error('Für diesen Zugang ist kein Schlüssel hinterlegt.'));
  const val=kind==='recovery'?normalizeRecoveryCode(secret):secret;
  return unwrapDek(slot,val)
    .then(raw=>subtle().importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']))
    .catch(()=>{ throw new Error(kind==='recovery'?'Wiederherstellungscode stimmt nicht.':'Falsches Passwort.'); });

function rewrapEnvelope(envelope,oldPassword,newPassword){
  const slot=envelope.slots&&envelope.slots.password;
  if(!slot) return Promise.reject(new Error('Kein Passwort-Schlüssel hinterlegt.'));

  const slot=envelope.slots&&envelope.slots.recovery;
  if(!slot) return Promise.reject(new Error('Kein Wiederherstellungsschlüssel hinterlegt.'));
  return unwrapDek(slot,normalizeRecoveryCode(recoveryCode))
    .catch(()=>{ throw new Error('Wiederherstellungscode stimmt nicht.'); })
    .then(dekRaw=>{
      const fresh=makeRecoveryCode();
      return Promise.all([wrapDek(dekRaw,newPassword),wrapDek(dekRaw,normalizeRecoveryCode(fresh))])
        .then(([pwSlot,recSlot])=>({
          envelope:{v:CRYPTO_VERSION,slots:{password:pwSlot,recovery:recSlot}},

/* ---- Umstellung auf Verschlüsselung ------------------------------------
 * Der heikelste Vorgang der ganzen App: hier werden bestehende Klartextdaten
 * unwiderruflich durch eine verschlüsselte Fassung ersetzt. Die Reihenfolge
 * ist deshalb bewusst gewählt und sollte nicht "aufgeräumt" werden:
 *
 *   1. verschlüsseln und schreiben
 *   2. zurücklesen, entschlüsseln und mit dem Original VERGLEICHEN
 *   3. erst dann den Umschlag ablegen   <- kippt die Betriebsart
 *   4. erst dann den Klartext löschen
 *
 * Der Umschlag ist der Schalter: sobald er liegt, liest boot() keinen
 * Klartext mehr. Läge er vor Schritt 2 und das Zurücklesen schlüge fehl,
 * sähe die App einen leeren Zustand und käme an die noch vorhandenen
 * Klartextdaten nicht mehr heran. Scheitert dagegen irgendetwas vor
 * Schritt 3, bleibt schlicht alles beim Alten - unverschlüsselt, aber
 * vollständig. Das ist in dieser Reihenfolge der harmlosere Ausgang.
 */
function migrateToEncrypted(password){
  if(encryptionActive()) return Promise.reject(new Error('Die Verschlüsselung ist auf diesem Gerät bereits eingerichtet.'));
  if(!password||String(password).length<6) return Promise.reject(new Error('Das Passwort braucht mindestens 6 Zeichen.'));
  const original=JSON.parse(JSON.stringify(S));
  let created=null;
  return createEnvelope(password).then(e=>{
    created=e;
    const prevDek=DEK;
    DEK=e.dek;
    return saveEncrypted(original)
      // Zurücklesen und vergleichen: erst wenn dieselben Daten wieder
      // herauskommen, ist der Klartext entbehrlich.
      .then(()=>loadEncrypted())
      .then(back=>{
        if(!back||!deepEqual(back,original)){
          throw new Error('Die verschlüsselte Fassung ließ sich nicht fehlerfrei zurücklesen. Es wurde nichts verändert.');
        }
        if(!storeEnvelope(e.envelope)){                    // ab hier gilt: verschlüsselt
          throw new Error('Der Schlüssel konnte nicht gespeichert werden. Es wurde nichts verändert.');
        }
        purgePlaintext();
        return {recoveryCode:e.recoveryCode};
      })
      .catch(err=>{
        // Aufräumen: alles zurück auf Klartextbetrieb, nichts halb Fertiges
        // stehen lassen.
        DEK=prevDek;
        try{ localStorage.removeItem(ENCKEY); }catch(e2){}
        try{ localStorage.removeItem(ENCMIRROR); }catch(e2){}
        try{ localStorage.removeItem(ENVKEY); }catch(e2){}
        throw err;
      });
  });
}

/* ===================== CLOUD SYNC (Supabase) =====================
 * Talks directly to Supabase's REST/Auth endpoints from the browser - no
 * build step, no serverless functions. The anon key is public by design;
 * actual protection comes from Row Level Security on the app_state table
 * (each row readable/writable only by its owner). Session tokens are kept

 * end up in an exported backup or get pushed to the cloud.

const SESSION_KEY='alltag-hub-session';

  try{ const raw=localStorage.getItem(SESSION_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }

function storeSession(x){

function syncCfg(){
  const c=(S.settings&&S.settings.sync)||{};
  return {url:String(c.url||'').trim().replace(/\/+$/,''),key:String(c.anonKey||'').trim()};

// input AND here, because settings can also arrive via an imported backup or
// a cloud payload, which never passed through the setup form.
function validSyncUrl(u){
  const v=String(u||'').trim();

  try{ const p=new URL(v); return p.protocol==='https:' && !!p.hostname && p.hostname.indexOf('.')>0; }
  catch(e){ return false; }

  return h;
}
function sbRead(res){
  return res.text().then(txt=>{
    let body=null;
    try{ body=txt?JSON.parse(txt):null; }catch(e){ body=txt; }
    if(!res.ok){
      const msg=(body&&(body.error_description||body.msg||body.message||body.error))||('Server antwortete mit HTTP '+res.status);
      const err=new Error(msg); err.status=res.status; throw err;
    }

function sbSignup(email,password){
  return fetch(syncCfg().url+'/auth/v1/signup',{method:'POST',headers:sbHeaders(false),
    body:JSON.stringify({email:email,password:password})}).then(sbRead).then(b=>{
      if(b&&b.access_token){
        storeSession({access_token:b.access_token,refresh_token:b.refresh_token,
          user_id:b.user&&b.user.id,email:(b.user&&b.user.email)||email});
        return {needsConfirm:false};

      return {needsConfirm:true};
    });
}
function sbLogin(email,password){
  return fetch(syncCfg().url+'/auth/v1/token?grant_type=password',{method:'POST',headers:sbHeaders(false),
    body:JSON.stringify({email:email,password:password})}).then(sbRead).then(b=>{
      storeSession({access_token:b.access_token,refresh_token:b.refresh_token,
        user_id:b.user&&b.user.id,email:(b.user&&b.user.email)||email});
      return b;
    });
}
function sbRefresh(){
  if(!SESS||!SESS.refresh_token) return Promise.reject(new Error('Keine gespeicherte Sitzung.'));
  return fetch(syncCfg().url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:sbHeaders(false),
    body:JSON.stringify({refresh_token:SESS.refresh_token})}).then(sbRead).then(b=>{
      storeSession({access_token:b.access_token,refresh_token:b.refresh_token,
        user_id:(b.user&&b.user.id)||SESS.user_id,email:(b.user&&b.user.email)||SESS.email});

    });

function sbLogout(){ storeSession(null); }

function sbAuthed(fn){

 * Verschlüsselt:        data = {enc:{v,iv,ct}, envelope:{…}}

  if(!isEncryptedPayload(d)) return Promise.resolve(d);

    const err=new Error('Die Daten in der Cloud sind verschlüsselt. Richte die Verschlüsselung auf diesem Gerät ein bzw. entsperre die App, um sie zu öffnen.');
    err.needsUnlock=true; err.envelope=d.envelope;

function syncDecision(serverRow,syncedAt,dirty){

  return dirty?'conflict':'pull';

  // ancestor the NEXT conflict gets 3-way-merged against. See mergeState().

/* ---- Fine-grained (3-way) merge for cloud sync -------------------------
 * Whole-state overwrite (always trust one side entirely) is only safe as
 * long as at most one side changed anything since the last sync. As soon
 * as BOTH sides changed something - even completely unrelated things, like
 * one device logging a workout and the other adding an expense - a plain
 * overwrite throws one of them away. SYNCBASE (see markSynced) mirrors the
 * state as of the last successful push/pull, so a conflict can be resolved
 * per-record: added on one side -> keep it; changed on only one side ->
 * take that side; unchanged -> irrelevant. Only records that were BOTH

const SYNCBASE='alltag-hub-v2-syncbase';
function deepEqual(a,b){

  for(let i=0;i<ak.length;i++){ const k=ak[i]; if(!Object.prototype.hasOwnProperty.call(b,k)||!deepEqual(a[k],b[k])) return false; }
  return true;
}
function indexBy(arr,key){ const m={}; (arr||[]).forEach(r=>{ if(r&&r[key]!==undefined) m[r[key]]=r; }); return m; }

function resolveRecordConflict(local,remote,nestedField,base,prefer){

    const rest=o=>{ const c=Object.assign({},o); delete c[nestedField]; return c; };

      const baseNested=(base&&Array.isArray(base[nestedField]))?base[nestedField]:null;
      const nested=mergeList(baseNested,local[nestedField],remote[nestedField],'id',null,prefer);
      if(nested.conflicts.length===0) return {merged:Object.assign({},local,{[nestedField]:nested.result}),conflict:false};

function mergeList(base,local,remote,idKey,nestedField,prefer){

  remote.forEach(r=>{ const k=r&&r[idKey]; if(k!==undefined&&!seen[k]){seen[k]=1;order.push(k);} });
  const out=[],conflicts=[];
  const counts={addedLocal:0,addedRemote:0,removedLocal:0,removedRemote:0,changedLocal:0,changedRemote:0,conflicted:0};
  order.forEach(id=>{

        return;

      const lc=!deepEqual(b,l),rc=!deepEqual(b,r);

      if(lc&&!rc){ out.push(l); counts.changedLocal++; return; }
      if(!lc&&rc){ out.push(r); counts.changedRemote++; return; }
      if(deepEqual(l,r)){ out.push(l); return; }
      const c=resolveRecordConflict(l,r,nestedField,b,prefer);
      out.push(c.merged);

      else { counts.changedLocal++; counts.changedRemote++; }

    if(l&&!r){
      if(!b){ out.push(l); counts.addedLocal++; return; }
      if(deepEqual(b,l)){ counts.removedRemote++; return; } // remote deleted it, local left it alone -> respect the deletion
      conflicts.push({id,local:l,remote:null,deletedRemote:true}); counts.conflicted++;
      if(prefer==='remote') counts.removedRemote++; else out.push(l); // local edited what remote deleted
      return;
    }
    if(!l&&r){
      if(!b){ out.push(r); counts.addedRemote++; return; }
      if(deepEqual(b,r)){ counts.removedLocal++; return; }
      conflicts.push({id,local:null,remote:r,deletedLocal:true}); counts.conflicted++;

  {path:['incomeEntries']},
  {path:['expenses']},
  {path:['items']},
  {path:['bodyweight']},
  {path:['goals']},
  {path:['balances']},

  if(counts.changedLocal) parts.push(counts.changedLocal+' lokale Änderung'+(counts.changedLocal===1?'':'en')+' behalten');

  if(syncBusy) return Promise.resolve({action:'busy'});
  syncBusy=true; setSyncMsg('Synchronisiere …');
  return cloudPull().then(row=>{
    let action=force==='local'?'push':force==='cloud'?'pull':syncDecision(row,(S.meta&&S.meta.syncedAt)||'',!!(S.meta&&S.meta.dirty));
    if(action==='pull'&&!row) action='push';
    if(action==='uptodate'){ setSyncMsg('Alles aktuell.'); return {action:'uptodate'}; }
    // Liegt in der Cloud eine verschlüsselte Fassung, die dieses Gerät nicht
    // öffnen kann, wird HIER abgebrochen - vor jeder Entscheidung über Push,
    // Pull oder Merge. Andernfalls würde gleich als Erstes der eigene Klartext
    // über die verschlüsselten Daten geschrieben.
    if(row&&isEncryptedPayload(row.data)&&!DEK){
      const env=row.data.envelope;
      if(env&&!encryptionActive()){
        // Zweites Gerät, erstmals verbunden: Umschlag übernehmen, danach kann
        // dasselbe Passwort die Daten öffnen.
        storeEnvelope(env);
        setSyncMsg('Die Daten in der Cloud sind verschlüsselt. Bitte die App mit deinem Passwort entsperren.',true);
        render();
        return {action:'needsunlock'};
      }
      setSyncMsg('Die Daten in der Cloud sind verschlüsselt. Bitte die App entsperren und erneut synchronisieren.',true);
      return {action:'needsunlock'};
    }
    if(action==='conflict'){
      let baseSnap=null;
      try{ const raw=localStorage.getItem(SYNCBASE); if(raw) baseSnap=JSON.parse(raw); }catch(e){}
      // No snapshot yet (first conflict after updating to 1.4.0, or a device
      // that has never completed a sync)? Then merge against an EMPTY base
      // instead of giving up. Consequence: nothing can be inferred as
      // "deleted on the other side", so no record is ever dropped - both
      // sides' entries are unioned and only same-id records that actually
      // differ still count as a conflict. Strictly safer than the old
      // all-or-nothing choice, which silently discarded one whole side.
      return readCloudData(row.data).then(remoteState=>{
        const mp=mergeState(baseSnap||{},S,remoteState);
        if(mp.conflicts.length===0){
          const prevS=S;
          S=mp.merged;
          if(!render()){ S=prevS; render(); U.syncConflict=row; setSyncMsg('',false); U.modal={type:'syncconflict'}; render(); return {action:'conflict'}; }
          return cloudPush(row).then(saved=>{ markSynced(saved&&saved.updated_at); setSyncMsg(mergeSummaryMsg(mp.counts)); render(); return {action:'merged',counts:mp.counts}; });
        }
        U.syncConflict=row; U.syncMergePreview=mp; setSyncMsg('',false); U.modal={type:'syncconflict'}; render();
        return {action:'conflict',conflicts:mp.conflicts.length};
      });
    }
    if(action==='pull'){ return applyRemote(row).then(()=>{ setSyncMsg('Von der Cloud geladen.'); return {action:'pulled'}; }); }
    return cloudPush(row).then(saved=>{ markSynced(saved&&saved.updated_at); setSyncMsg('In die Cloud gesichert.'); render(); return {action:'pushed'}; });
  }).catch(e=>{
    setSyncMsg(e.message||'Synchronisieren fehlgeschlagen.',true);
    return {action:'error',error:e};
  }).then(r=>{ syncBusy=false; return r; });
}
let autoSyncTimer=null;
function scheduleAutoSync(){
  if(!syncConfigured()||!syncLoggedIn()) return;
  clearTimeout(autoSyncTimer);
  autoSyncTimer=setTimeout(()=>{ doSync(); },6000);
}

/* ===================== GLOBAL SEARCH ===================== */
function globalSearch(q){
  q=(q||'').toLowerCase().trim();
  const out={workouts:[],exercises:[],expenses:[],income:[],fixed:[],goals:[],items:[],habits:[],tasks:[]};
  if(!q) return out;
  S.plan.workouts.forEach(w=>{
    if(w.name.toLowerCase().includes(q)) out.workouts.push(w);
    w.exercises.forEach(ex=>{ if(ex.name.toLowerCase().includes(q)) out.exercises.push({ex:ex,workout:w}); });
  });
  S.expenses.forEach(e=>{ if(e.name.toLowerCase().includes(q)) out.expenses.push(e); });
  S.setup.income.forEach(e=>{ if(e.name.toLowerCase().includes(q)) out.income.push({e:e,kind:'income'}); });
  S.incomeEntries.forEach(e=>{ if(e.name.toLowerCase().includes(q)) out.income.push({e:e,kind:'incomeEntry'}); });
  S.setup.fixedCosts.forEach(f=>{ if(f.name.toLowerCase().includes(q)) out.fixed.push(f); });
  S.goals.forEach(g=>{ if(g.name.toLowerCase().includes(q)) out.goals.push(g); });
  S.items.forEach(i=>{
    if(i.title.toLowerCase().includes(q)||(i.notes||'').toLowerCase().includes(q)||(i.hooks||[]).some(hk=>hk.toLowerCase().includes(q)))
      out.items.push(i);
  });
  S.habits.forEach(h=>{ if(h.name.toLowerCase().includes(q)) out.habits.push(h); });
  S.tasks.forEach(t=>{ if(t.title.toLowerCase().includes(q)) out.tasks.push(t); });
  return out;
}
function searchResultCount(r){
  return r.workouts.length+r.exercises.length+r.expenses.length+r.income.length+
    r.fixed.length+r.goals.length+r.items.length+r.habits.length+r.tasks.length;
}
function openSearchResult(kind,id){
  if(kind==='workout'){ const w=S.plan.workouts.find(x=>x.id===id);
    if(w){ U.tab='training';U.ts='plan';U.exp[w.id]=true;U.modal=null; } }
  else if(kind==='exercise'){
    for(const w of S.plan.workouts){ const ex=w.exercises.find(x=>x.id===id);
      if(ex){ U.tab='training';U.ts='plan';U.exp[w.id]=true;U.modal={type:'exercise',workoutId:w.id,id:ex.id}; break; } } }
  else if(kind==='expense'){ const e=S.expenses.find(x=>x.id===id);
    if(e){ U.tab='budget';U.bs='expenses';U.month=e.date.slice(0,7);U.modal={type:'expense',id:e.id}; } }
  else if(kind==='income'){ const e=S.setup.income.find(x=>x.id===id);
    if(e){ U.tab='budget';U.bs='income';U.modal={type:'income',id:e.id}; } }
  else if(kind==='incomeEntry'){ const e=S.incomeEntries.find(x=>x.id===id);
    if(e){ U.tab='budget';U.bs='income';U.month=e.date.slice(0,7);U.modal={type:'incomeEntry',id:e.id}; } }
  else if(kind==='fixed'){ const f=S.setup.fixedCosts.find(x=>x.id===id);
    if(f){ U.tab='budget';U.bs='fixed';U.modal={type:'fixed',id:f.id}; } }
  else if(kind==='goal'){ const g=S.goals.find(x=>x.id===id);
    if(g){ U.tab='budget';U.bs='goals';U.modal={type:'goal',id:g.id}; } }
  else if(kind==='item'){ const i=S.items.find(x=>x.id===id);
    if(i){ U.tab='content';U.cs='board';U.modal={type:'item',id:i.id}; } }
  else if(kind==='habit'){ const h=S.habits.find(x=>x.id===id);
    if(h){ U.tab='habits';U.modal={type:'habit',id:h.id}; } }
  else if(kind==='task'){ const t=S.tasks.find(x=>x.id===id);
    if(t){ U.tab='home';U.modal={type:'task',id:t.id}; } }
  U.searchGlobal='';
  render();
}

/* ===================== MODALS ===================== */
function sheet(title,inner,delKind){
  // role/aria-modal machen aus dem Kasten einen echten Dialog: Screenreader
  // kündigen ihn an und behandeln den Inhalt dahinter als vorübergehend
  // unwichtig. aria-labelledby gibt ihm dabei den sichtbaren Titel als Namen.
  return '<div class="overlay" id="ov"><form class="sheet" id="sf" role="dialog" aria-modal="true" aria-labelledby="shTitle">'+
   '<div class="sh"><span class="sht" id="shTitle">'+title+'</span>'+
   '<button type="button" class="iconbtn" data-mclose="1" aria-label="Schliessen">'+ic('x')+'</button></div>'+inner+
   (delKind?'<button type="button" class="del" data-mdel="'+delKind+'">'+ic('trash','sm')+' Löschen</button>':'')+
   '</form></div>';
}
function picks(field,opts,cur,colorOf){
  return '<div class="chips">'+opts.map(o=>{const c=COL(colorOf(o.k));const on=cur===o.k;
   return '<button type="button" class="chip" data-pick="'+esc(field)+'|'+esc(o.k)+'"'+
    (on?' style="background:'+c+'22;border-color:'+c+';color:#fff"':'')+'>'+esc(o.l)+'</button>';}).join('')+'</div>';
}

  if(m.type==='habit'){

     '<textarea class="f" name="hooks" placeholder="Warum ich jeden Tag um 5 aufstehe">'+esc(it&&it.hooks?it.hooks.join('\n'):'')+'</textarea>'+
     '<label class="lab">Notizen</label><input class="f" name="notes" value="'+esc(it?it.notes||'':'')+'" placeholder="Schnittkonzept, Länge …">'+
     '<button type="submit" class="btn grad" style="margin-top:22px">Speichern</button>',
     it?'item':null);
  }
  if(m.type==='sessionentry'){
    const sess=S.sessions.find(x=>x.id===m.sessionId);
    const en=sess?sess.entries.find(x=>x.id===m.entryId):null;
    if(!en) return '';
    const c=tcOf(en.cat);
    const sets=m.sets||[];
    let inner='<div class="panel-s" style="margin:0 0 12px">'+fmtD(sess.date)+' · '+esc(en.name)+'</div>';
    if(c.mode==='single'){
      inner+='<label class="lab" style="margin-top:0">Wert ('+esc(c.unit)+')</label>'+
        '<input class="f" name="value" type="number" step="any" inputmode="decimal" value="'+esc(en.value!=null?en.value:'')+'">';
    } else {
      inner+='<div class="setrow" style="color:var(--dim2);font-size:10.5px;font-weight:700;margin-bottom:4px">'+
        '<span></span><span>WDH</span><span>KG</span><span></span></div>';
      sets.forEach((s,i)=>{
        inner+='<div class="setrow"><span class="setn">'+(i+1)+'</span>'+
         '<input class="f eserep" type="number" inputmode="numeric" placeholder="Wdh" value="'+esc(s.reps||'')+'" style="min-height:44px;padding:10px">'+
         '<input class="f esewt" type="number" step="any" inputmode="decimal" placeholder="kg" value="'+esc(s.weight||'')+'" style="min-height:44px;padding:10px">'+
         '<button type="button" class="iconbtn" data-esermset="'+i+'">'+ic('x','sm')+'</button></div>';
      });
      inner+='<button type="button" class="btn dash" data-eseaddset="1" style="min-height:40px;margin-top:2px">'+ic('plus','xs')+' Satz</button>';
    }
    inner+='<label class="lab">Notiz</label><input class="f" name="note" value="'+esc(en.note||'')+'">'+
      '<button type="submit" class="btn grad" style="margin-top:22px">Speichern</button>';
    return sheet('Eintrag bearbeiten',inner,'sessionentry');
  }
  if(m.type==='customcat'){
    const kind=m.kind;
    const list=(S.settings.customCategories&&S.settings.customCategories[kind])||[];
    const existing=m.key?list.find(c=>c.key===m.key):null;
    const label=m.label!==undefined?m.label:(existing?existing.label:'');
    const color=m.color||(existing?existing.color:CATPALETTE[0]);
    let inner='<label class="lab" style="margin-top:0">Name</label>'+
      '<input class="f" name="label" value="'+esc(label)+'" placeholder="'+(kind==='training'?'z. B. Yoga, Schwimmen':'z. B. Abos, Kinder')+'" required>'+
      '<label class="lab">Farbe</label><div class="chips">'+
      CATPALETTE.map(col=>'<button type="button" class="chip" data-pick="color|'+col+'" style="width:44px;justify-content:center;'+
        (color===col?'border-color:'+col+';background:'+col+'22':'')+'"><span class="dot" style="background:'+col+'"></span></button>').join('')+
      '</div>';
    if(kind==='training'){
      const unit=m.unit!==undefined?m.unit:(existing?existing.unit:'kg');
      const mode=m.mode||(existing?existing.mode:'sets');
      inner+='<label class="lab">Einheit</label><input class="f" name="unit" value="'+esc(unit)+'" placeholder="kg, min, km, Wdh …">'+
        '<label class="lab">Modus</label>'+
        picks('mode',[{k:'sets',l:'Sätze (Gewicht × Wdh)'},{k:'single',l:'Einzelwert'}],mode,()=>'#8B5CF6');
    }
    inner+='<button type="submit" class="btn grad" style="margin-top:22px">Speichern</button>';
    return sheet(existing?'Kategorie bearbeiten':'Kategorie hinzufügen',inner,existing?'customcat':null);
  }
  return '';
}

  if(!t)return; const d=t.dataset;

  if(d.undo){doUndo();return;}
  if(d.restoremirror){

    }catch(e){ alert('Wiederherstellung fehlgeschlagen: '+e.message); }

  if(d.hardreload){ location.reload(); return; }

  if(d.mclose){U.modal=null;U.syncMergePreview=null;render();return;}

  if(d.tpl!==undefined){stash();U.modal.tpl=d.tpl||null;render();return;}
  if(d.dtog){stash();

      else { const w=S.plan.workouts.find(x=>x.id===U.modal.id); if(w) existing=(w.weekdays||[]).slice(); }
    }
    let ds=U.modal.weekdays||existing;
    const i=ds.indexOf(d.dtog);if(i>=0)ds.splice(i,1);else ds.push(d.dtog);
    U.modal.weekdays=ds;render();return;}
  if(d.mdel){mDelete(d.mdel);return;}
  if(d.settings){U.modal={type:'settings'};render();return;}
  if(d.globalsearch){U.searchGlobal=U.searchGlobal||'';U.modal={type:'globalsearch'};render();return;}
  if(d.searchresult){const[kind,id]=d.searchresult.split('|');openSearchResult(kind,id);return;}
  if(d.syncsetup){U.syncMsg='';U.modal={type:'syncsetup'};render();return;}
  if(d.syncaccount){U.syncMsg='';U.modal={type:'syncaccount',mode:'login'};render();return;}
  if(d.syncnow){U.syncMsg='';doSync();render();return;}
  if(d.synclogout){
    sbLogout();
    if(S.meta){S.meta.syncedAt='';}
    U.syncMsg=''; commit(); return;
  }
  if(d.acctskip){ U.acctSkip=true; render(); return; }
  if(d.encsetup){ U.encErr=''; U.encBackupDone=false; U.modal={type:'encsetup'}; render(); return; }
  if(d.runencsetup){
    if(U.encBusy||!U.encBackupDone) return;
    const a=document.getElementById('encPw1'), b=document.getElementById('encPw2');
    const p1=(a&&a.value)||'', p2=(b&&b.value)||'';
    if(p1.length<6){ U.encErr='Das Passwort braucht mindestens 6 Zeichen.'; render(); return; }
    if(p1!==p2){ U.encErr='Die beiden Passwörter stimmen nicht überein.'; render(); return; }
    U.encBusy=true; U.encErr=''; render();
    migrateToEncrypted(p1).then(res=>{
      U.encBusy=false; U.encBackupDone=false;
      U.modal={type:'recoverycode',code:res.recoveryCode};
      render();
    }).catch(e=>{
      U.encBusy=false; U.encErr=e.message||'Einrichten fehlgeschlagen.'; render();
    });
    return;
  }
  if(d.recack){ U.modal.confirmed=t.checked!==undefined?t.checked:!U.modal.confirmed; render(); return; }
  if(d.copyreccode){
    try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(d.copyreccode); }catch(e){}
    celebrate('Code kopiert');
    return;
  }
  if(d.reccodedone){
    if(!U.modal||!U.modal.confirmed) return;
    U.modal=null; render(); return;
  }
  if(d.lockmode){ U.lockMode=d.lockmode; U.lockErr=''; render(); return; }
  if(d.dounlock){
    if(U.lockBusy) return;
    const el=document.getElementById('lockPw');
    const pw=(el&&el.value)||'';
    if(!pw){ U.lockErr='Bitte Passwort eingeben.'; render(); return; }
    U.lockBusy=true; U.lockErr=''; render();
    unlockAndLoad(pw).then(()=>{
      U.lockBusy=false; U.lockErr=''; render();
    }).catch(e=>{
      U.lockBusy=false; U.lockErr=e.message||'Entsperren fehlgeschlagen.'; render();
    });
    return;
  }
  if(d.dorecover){
    if(U.lockBusy) return;
    const codeEl=document.getElementById('recCode'), pwEl=document.getElementById('recNewPw');
    const code=(codeEl&&codeEl.value)||'', npw=(pwEl&&pwEl.value)||'';
    if(!code||!npw){ U.lockErr='Bitte Code und neues Passwort eingeben.'; render(); return; }
    if(npw.length<6){ U.lockErr='Das neue Passwort braucht mindestens 6 Zeichen.'; render(); return; }
    U.lockBusy=true; U.lockErr=''; render();
    // Erst die Daten öffnen, dann den Umschlag neu packen. Andersherum stünde
    // man bei einem Fehler dazwischen mit einem Umschlag da, dessen Passwort
    // niemand kennt.
    unlockAndLoad(code,'recovery').then(()=>{
      const env=storedEnvelope();
      return resetPasswordWithRecovery(env,code,npw).then(r=>{
        if(!storeEnvelope(r.envelope)) throw new Error('Der neue Schlüssel konnte nicht gespeichert werden.');
        U.lockBusy=false; U.lockErr=''; U.lockMode='password';
        U.modal={type:'recoverycode',code:r.recoveryCode,afterReset:true};
        render();
      });
    }).catch(e=>{
      U.lockBusy=false; U.lockErr=e.message||'Wiederherstellung fehlgeschlagen.'; render();
    });
    return;
  }
  if(d.syncresolve){
    const how=d.syncresolve;
    U.modal=null; U.syncConflict=null; U.syncMergePreview=null; render();
    doSync(how);
    return;
  }
  if(d.syncmerge){
    const prefer=d.syncmerge;
    const row=U.syncConflict;
    let baseSnap=null;
    try{ const raw=localStorage.getItem(SYNCBASE); if(raw) baseSnap=JSON.parse(raw); }catch(e){}
    U.modal=null; U.syncConflict=null; U.syncMergePreview=null;
    if(!row){ render(); return; }
    const mp=mergeState(baseSnap||{},S,row.data,prefer);
    const prevS=S;
    S=mp.merged;
    if(!render()){ S=prevS; setSyncMsg('Zusammenführen fehlgeschlagen.',true); render(); return; }
    syncBusy=true; setSyncMsg('Synchronisiere …'); render();
    cloudPush().then(saved=>{
      markSynced(saved&&saved.updated_at); syncBusy=false; setSyncMsg(mergeSummaryMsg(mp.counts)); render();
    }).catch(e=>{ syncBusy=false; setSyncMsg(e.message||'Zusammenführen fehlgeschlagen.',true); render(); });
    return;
  }
  if(d.opencsvimport){U.modal={type:'csvimport'};render();return;}
  if(d.resetcsvimport){U.modal={type:'csvimport'};render();return;}
  if(d.runcsvimport){
    const rows=U.modal&&U.modal.rows;
    if(!rows||!rows.some(r=>r.valid)) return;
    const res=importExpenseCsvRows(rows);
    U.modal=null;
    commit();

  if(d.eie){U.modal={type:'incomeEntry',id:d.eie};render();return;}
  if(d.die){const it=S.incomeEntries.find(x=>x.id===d.die);
    withUndo(it?it.name:'Einnahme',()=>{S.incomeEntries=S.incomeEntries.filter(x=>x.id!==d.die);});return;}
  if(d.af){U.modal={type:'fixed'};render();return;}
  if(d.ef){U.modal={type:'fixed',id:d.ef};render();return;}
  if(d.df){const it=S.setup.fixedCosts.find(x=>x.id===d.df);
    withUndo(it?it.name:'Fixkosten',()=>{S.setup.fixedCosts=S.setup.fixedCosts.filter(x=>x.id!==d.df);});return;}
  if(d.ax){U.modal={type:'expense'};render();return;}
  if(d.ex){U.modal={type:'expense',id:d.ex};render();return;}
  if(d.dx){const it=S.expenses.find(x=>x.id===d.dx);
    withUndo(it?it.name:'Ausgabe',()=>{S.expenses=S.expenses.filter(x=>x.id!==d.dx);});return;}
  if(d.reconcile){
    const v=document.getElementById('balV'), dt=document.getElementById('balD');
    if(!v||v.value===''){alert('Bitte den aktuellen Kontostand eintragen.');return;}
    U.rec=reconcile(Number(v.value),(dt&&dt.value)||today());
    if(U.rec.first){ S.balances.push({id:uid(),date:U.rec.date,amount:U.rec.amount,note:'Startwert'}); commit(); return; }
    render(); return; }
  if(d.balsave){ const r=U.rec; if(!r)return;
    S.balances.push({id:uid(),date:r.date,amount:r.amount,note:''});
    U.rec=null; commit(); return; }
  if(d.balbook){ const r=U.rec; if(!r||r.first)return;
    const amt=Math.abs(r.delta);
    if(r.delta<0) S.expenses.push({id:uid(),name:'Nicht erfasste Ausgaben',amount:amt,
      category:'sonstiges',date:r.date,videoId:'',business:false,correction:true});
    else S.incomeEntries.push({id:uid(),name:'Nicht erfasste Einnahmen',amount:amt,
      date:r.date,business:false,correction:true});
    S.balances.push({id:uid(),date:r.date,amount:r.amount,note:'mit Korrektur '+(r.delta<0?'-':'+')+eur2(amt)});
    U.rec=null; commit(); return; }
  if(d.dbal){ const b=S.balances.find(x=>x.id===d.dbal);
    withUndo('Abgleich '+(b?fmtD(b.date):''),()=>{S.balances=S.balances.filter(x=>x.id!==d.dbal);}); return; }
  if(d.ag){U.modal={type:'goal'};render();return;}
  if(d.eg){U.modal={type:'goal',id:d.eg};render();return;}
  if(d.dg){const it=S.goals.find(x=>x.id===d.dg);
    withUndo(it?it.name:'Sparziel',()=>{S.goals=S.goals.filter(x=>x.id!==d.dg);});return;}
  if(d.as){U.modal={type:'addsaved',id:d.as};render();return;}

  if(d.ai2){U.modal={type:'item',presetDate:(d.ai2!=='1'?d.ai2:'')};render();return;}
  if(d.eit){U.modal={type:'item',id:d.eit};render();return;}
  if(d.mv){const[id,dir]=d.mv.split('|');const it=S.items.find(x=>x.id===id);
    const i=STO.indexOf(it.status);
    it.status=STO[Math.max(0,Math.min(STO.length-1,i+Number(dir)))];
    U.keep=window.scrollY;commit();return;}
});
function stash(){const f=document.getElementById('sf');if(!f||!U.modal)return;
  U.modal._v={};new FormData(f).forEach((v,k)=>{U.modal._v[k]=v;});}

document.addEventListener('change',function(e){
  if(e.target.id==='logW'){syncDraft();U.draft.workoutId=e.target.value;initDraft();render();}
  if(e.target.id==='logD'){U.draft.date=e.target.value;}
  if(e.target.id==='impf'&&e.target.files&&e.target.files[0]){importJSON(e.target.files[0]);}
  if(e.target.id==='csvf'&&e.target.files&&e.target.files[0]){
    const file=e.target.files[0];
    const r=new FileReader();
    r.onload=()=>{
      try{ const rows=parseExpenseCsv(String(r.result)); U.modal={type:'csvimport',rows:rows}; render(); }
      catch(err){ alert('CSV konnte nicht gelesen werden: '+err.message); }
    };
    r.readAsText(file);
  }
  if(e.target.id==='bizchk'&&U.modal){U.modal.business=e.target.checked;}
  if(e.target.dataset&&e.target.dataset.modtoggle){
    if(!S.settings)S.settings={appName:'',modules:{}};
    if(!S.settings.modules)S.settings.modules={training:true,budget:true,content:true,habitsTab:true};
    S.settings.modules[e.target.dataset.modtoggle]=e.target.checked;
    save(); render();
  }
});

document.addEventListener('input',function(e){
  if(e.target.id==='expSearch'||e.target.id==='contentSearch'||e.target.id==='progSearch'||e.target.id==='globalSearch'){
    const id=e.target.id, pos=e.target.selectionStart, val=e.target.value;
    if(id==='expSearch')U.searchExp=val;
    else if(id==='contentSearch')U.searchContent=val;
    else if(id==='globalSearch')U.searchGlobal=val;
