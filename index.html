document.addEventListener('submit',function(e){
  if(e.target.id!=='sf')return; e.preventDefault();
  const f=e.target,m=U.modal;
  const g=n=>{const el=f.elements[n];if(el&&el.value!=='')return el.value;
    if(m._v&&m._v[n]!==undefined)return m._v[n];return'';};
  const biz=()=>{const c=f.querySelector('#bizchk');return c?c.checked:!!m.business;};

  if(m.type==='habit'){
    const n=g('name').trim();if(!n)return;
    const days=m.weekdays!==undefined?m.weekdays:[];
    const hb=m.id?S.habits.find(x=>x.id===m.id):null;
    if(hb){hb.name=n;hb.weekdays=days;}
    else S.habits.push({id:uid(),name:n,weekdays:days});
  }
  else if(m.type==='task'){
    const ti=g('title').trim();if(!ti)return;
    const dt=g('date')||today();
    const it=m.id?S.tasks.find(x=>x.id===m.id):null;
    const prio=m.priority||(it?it.priority:'soll');
    if(it){it.title=ti;it.priority=prio;it.date=dt;}
    else S.tasks.push({id:uid(),title:ti,priority:prio,date:dt,done:false});
  }
  else if(m.type==='workout'){
    const n=g('name').trim();if(!n)return;
    const w=m.id?S.plan.workouts.find(x=>x.id===m.id):null;
    const days=m.weekdays!==undefined?m.weekdays:(w?w.weekdays||[]:[]);
    if(w){w.name=n;w.weekdays=days;}
    else{
      const tplEx = m.tpl && TEMPLATES[m.tpl] ? TEMPLATES[m.tpl].ex.map(e=>
        ({id:uid(),name:e[0],cat:e[1],targetSets:e[2],targetReps:e[3],restSec:e[4],goalValue:''})) : [];
      const nw={id:uid(),name:n,exercises:tplEx,weekdays:days};S.plan.workouts.push(nw);U.exp[nw.id]=true;
    }
  }
  else if(m.type==='exercise'){
    const w=S.plan.workouts.find(x=>x.id===m.workoutId);
    const n=g('name').trim();if(!n)return;
    const old=m.id?w.exercises.find(x=>x.id===m.id):null;
    const cat=m.cat||(old?old.cat:'kraft');
    const o={id:m.id||uid(),name:n,cat:cat,
      targetSets:Number(g('targetSets'))||3,targetReps:Number(g('targetReps'))||8,
      restSec:Number(g('restSec'))||90,
      goalValue:g('goalValue')===''?'':Number(g('goalValue'))};
    if(m.id)w.exercises=w.exercises.map(x=>x.id===m.id?o:x);else w.exercises.push(o);
    U.draft=null;
  }
  else if(m.type==='income'){
    const n=g('name').trim(),a=Number(g('amount'));if(!n||isNaN(a))return;
    const o={id:m.id||uid(),name:n,amount:a,validFrom:g('validFrom'),validTo:g('validTo')};
    if(m.id)S.setup.income=S.setup.income.map(x=>x.id===m.id?o:x);else S.setup.income.push(o);
  }
  else if(m.type==='incomeEntry'){
    const n=g('name').trim(),a=Number(g('amount')),dt=g('date');if(!n||isNaN(a)||!dt)return;
    const o={id:m.id||uid(),name:n,amount:a,date:dt,business:biz()};
    if(m.id)S.incomeEntries=S.incomeEntries.map(x=>x.id===m.id?o:x);else S.incomeEntries.push(o);
  }
  else if(m.type==='fixed'){
    const it=m.id?S.setup.fixedCosts.find(x=>x.id===m.id):null;
    const n=g('name').trim(),a=Number(g('amount'));if(!n||isNaN(a))return;
    const o={id:m.id||uid(),name:n,amount:a,category:m.cat||(it?it.category:'wohnen'),
      frequency:m.freq||(it?it.frequency||'monatlich':'monatlich'),
      validFrom:g('validFrom'),validTo:g('validTo')};
    if(m.id)S.setup.fixedCosts=S.setup.fixedCosts.map(x=>x.id===m.id?o:x);else S.setup.fixedCosts.push(o);
  }
  else if(m.type==='expense'){
    const it=m.id?S.expenses.find(x=>x.id===m.id):null;
    const n=g('name').trim(),a=Number(g('amount')),dt=g('date');if(!n||isNaN(a)||!dt)return;
    const o={id:m.id||uid(),name:n,amount:a,category:m.cat||(it?it.category:'sonstiges'),
      date:dt,videoId:g('videoId')||'',business:biz()};
    if(m.id)S.expenses=S.expenses.map(x=>x.id===m.id?o:x);else S.expenses.push(o);
  }
  else if(m.type==='goal'){
    const n=g('name').trim(),tg=Number(g('target'));if(!n||isNaN(tg))return;
    const o={id:m.id||uid(),name:n,target:tg,saved:Number(g('saved')||0),deadline:g('deadline')||''};
    if(m.id)S.goals=S.goals.map(x=>x.id===m.id?o:x);else S.goals.push(o);
  }
  else if(m.type==='addsaved'){
    const a=Number(g('amount'));if(isNaN(a))return;
    const go=S.goals.find(x=>x.id===m.id);
    const before=Number(go.saved||0);
    go.saved=before+a;
    if(before<Number(go.target)&&go.saved>=Number(go.target)) U.justHitGoal=go.name;
  }
  else if(m.type==='item'){
    const it=m.id?S.items.find(x=>x.id===m.id):null;
    const ti=g('title').trim();if(!ti)return;
    const rc=m.recurring!==undefined?m.recurring:(it?!!it.recurring:false);
    const o={id:m.id||uid(),title:ti,
      platform:m.platform||(it?it.platform:'youtube'),
      status:m.status||(it?it.status:'idee'),
      format:m.format||(it?it.format||'sonstiges':'sonstiges'),
      recurring:rc,weekday:rc?(m.weekday||(it&&it.weekday?it.weekday:'Mo')):'',
      date:rc?'':(g('date')||''),
      views:g('views')===''?'':Number(g('views')),
      revenue:g('revenue')===''?'':Number(g('revenue')),
      notes:g('notes').trim(),
      hooks:g('hooks').split('\n').map(s=>s.trim()).filter(Boolean)};
    if(m.id)S.items=S.items.map(x=>x.id===m.id?o:x);else S.items.push(o);
  }
  else if(m.type==='sessionentry'){
    const sess=S.sessions.find(x=>x.id===m.sessionId);
    const en=sess&&sess.entries.find(x=>x.id===m.entryId);
    if(!en){ U.modal=null; commit(); return; }
    const c=tcOf(en.cat);
    if(c.mode==='single'){
      const v=g('value');
      en.value=v===''?0:Number(v);
    } else {
      syncEntryModal();
      const sets=(U.modal.sets||[]).filter(s=>s.reps!==''||s.weight!=='')
        .map(s=>({reps:s.reps===''?null:Number(s.reps),weight:s.weight===''?0:Number(s.weight)}));
      en.sets=sets;
    }
    en.note=g('note').trim();
  }
  else if(m.type==='syncsetup'){
    const url=g('url').trim(), key=g('anonKey').trim();
    if(!url||!key) return;
    // Password, anon key and (later) the access token are all sent to this
    // host. A typo'd or hostile URL would leak them, and over plain http they
    // would travel readable on the wire - so anything but https is refused
    // outright rather than merely warned about.
    if(!validSyncUrl(url)){
      U.syncMsg='Bitte eine vollständige https-Adresse eintragen, z. B. https://deinprojekt.supabase.co – andere Adressen sind nicht erlaubt, weil dorthin dein Passwort und dein Zugangs-Token gesendet würden.';
      U.syncErr=true; render(); return;
    }
    if(!S.settings.sync)S.settings.sync={url:'',anonKey:''};
    S.settings.sync.url=url; S.settings.sync.anonKey=key;
    U.modal=null; commit();
    U.syncMsg=''; U.modal={type:'syncaccount',mode:'login'}; render();
    return;
  }
  else if(m.type==='syncaccount'){
    const email=g('email').trim(), pw=g('password');
    if(!email||!pw) return;
    const mode=m.mode||'login';
    U.syncMsg='Bitte warten …'; U.syncErr=false; render();
    const done=()=>{ U.syncMsg=''; U.modal=null; commit(); doSync(); };
    const fail=e=>{ U.syncMsg=e.message||'Fehlgeschlagen.'; U.syncErr=true; render(); };
    if(mode==='signup'){
      sbSignup(email,pw).then(r=>{
        if(r.needsConfirm){
          U.syncMsg='Konto angelegt. Bestätige zuerst die E-Mail, dann kannst du dich anmelden.';
          U.syncErr=false; U.modal={type:'syncaccount',mode:'login',email:email}; render();
        } else done();
      }).catch(fail);
    } else {
      sbLogin(email,pw).then(done).catch(fail);
    }
    return;
  }
  else if(m.type==='customcat'){
    const kind=m.kind;
    const label=g('label').trim();
    if(!label){ return; }
    if(!S.settings.customCategories)S.settings.customCategories={budget:[],training:[]};
    if(!S.settings.customCategories[kind])S.settings.customCategories[kind]=[];
    const list=S.settings.customCategories[kind];
    const color=m.color||CATPALETTE[0];
    if(m.key){
      const existing=list.find(c=>c.key===m.key);
      if(existing){
        existing.label=label; existing.color=color;
        if(kind==='training'){ existing.unit=(g('unit')||'kg').trim()||'kg'; existing.mode=m.mode||existing.mode||'sets'; }
      }
    } else {
      const existingKeys=kind==='budget'?allBCO():allTCO();
      const key=uniqueCatKey(label,existingKeys);
      const cat={key:key,label:label,color:color};
      if(kind==='training'){ cat.unit=(g('unit')||'kg').trim()||'kg'; cat.mode=m.mode||'sets'; }
      list.push(cat);
    }
  }
  U.modal=null;commit();
  if(U.justHitGoal){ celebrate('Ziel erreicht! '+U.justHitGoal); U.justHitGoal=null; }
});
// Single source of truth for entity deletion, shared between the inline
// list-row delete buttons and the edit-modal's "Löschen" button (mDelete) -
// previously these were two independently-maintained copies of the same
// filter logic that could silently drift apart.
function deleteExercise(workoutId,exId){
  const wo=S.plan.workouts.find(y=>y.id===workoutId);
  const ex=wo?wo.exercises.find(y=>y.id===exId):null;
  withUndo(ex?ex.name:'Übung',()=>{
    if(wo) wo.exercises=wo.exercises.filter(y=>y.id!==exId);
    U.draft=null;
  });
}
function deleteHabit(id){
  const hb=S.habits.find(x=>x.id===id);
  withUndo(hb?hb.name:'Habit',()=>{
    S.habits=S.habits.filter(x=>x.id!==id);
    S.habitLog=S.habitLog.filter(l=>l.habitId!==id);
  });
}
function deleteTask(id){
  const tk=S.tasks.find(x=>x.id===id);
  withUndo(tk?tk.title:'Task',()=>{
    S.tasks=S.tasks.filter(x=>x.id!==id);
  });
}
function deleteItem(id){
  const it=S.items.find(x=>x.id===id);
  withUndo(it?it.title:'Idee',()=>{
    S.items=S.items.filter(x=>x.id!==id);
    S.expenses.forEach(e=>{if(e.videoId===id)e.videoId='';});
  });
}
function deleteSessionEntry(sessionId,entryId){
  const s=S.sessions.find(x=>x.id===sessionId);
  const en=s?s.entries.find(x=>x.id===entryId):null;
  withUndo(en?en.name:'Eintrag',()=>{
    if(!s)return;
    s.entries=s.entries.filter(x=>x.id!==entryId);
    if(!s.entries.length) S.sessions=S.sessions.filter(x=>x.id!==sessionId);
  });
}
function deleteCustomCat(kind,key){
  const list=(S.settings.customCategories&&S.settings.customCategories[kind])||[];
  const cat=list.find(c=>c.key===key);
  withUndo(cat?cat.label:'Kategorie',()=>{
    if(!S.settings.customCategories)S.settings.customCategories={budget:[],training:[]};
    S.settings.customCategories[kind]=list.filter(c=>c.key!==key);
  });
}
function syncEntryModal(){
  if(!U.modal||U.modal.type!=='sessionentry') return;
  document.querySelectorAll('.eserep').forEach((inp,i)=>{ if(U.modal.sets[i]) U.modal.sets[i].reps=inp.value; });
  document.querySelectorAll('.esewt').forEach((inp,i)=>{ if(U.modal.sets[i]) U.modal.sets[i].weight=inp.value; });
}
function mDelete(k){
  const m=U.modal;
  U.modal=null;
  if(k==='exercise'){ deleteExercise(m.workoutId,m.id); return; }
  if(k==='item'){ deleteItem(m.id); return; }
  if(k==='habit'){ deleteHabit(m.id); return; }
  if(k==='task'){ deleteTask(m.id); return; }
  if(k==='sessionentry'){ deleteSessionEntry(m.sessionId,m.entryId); return; }
  if(k==='customcat'){ deleteCustomCat(m.kind,m.key); return; }
}
function saveSession(){
  syncDraft();
  const w=S.plan.workouts.find(x=>x.id===U.draft.workoutId);
  if(!w){alert('Kein Workout ausgewählt.');return;}
  const entries=[];
  const prevTop={};
  w.exercises.forEach(ex=>{
    const d=U.draft.ex[ex.id];if(!d)return;
    const c=tcOf(ex.cat);
    if(c.mode==='single'){
      if(d.value==='')return;
      entries.push({id:uid(),exerciseId:ex.id,name:ex.name,cat:ex.cat,value:Number(d.value),sets:null,note:d.note||''});
    }else{
      const sets=(d.sets||[]).filter(s=>s.reps!==''||s.weight!=='')
        .map(s=>({reps:s.reps===''?null:Number(s.reps),weight:s.weight===''?0:Number(s.weight)}));
      if(!sets.length)return;
      if(c.mode==='sets'){
        const hist=historyFor(ex.id,999);
        prevTop[ex.id]=hist.length?Math.max.apply(null,hist.map(hh=>topOf(hh.entry))):0;
      }
      entries.push({id:uid(),exerciseId:ex.id,name:ex.name,cat:ex.cat,sets:sets,note:d.note||'',rpe:d.rpe||''});
    }
  });
  if(!entries.length){alert('Trag mindestens einen Wert ein.');return;}
  let pr=null;
  entries.forEach(e=>{
    if(e.sets&&prevTop[e.exerciseId]!==undefined){
      const top=topOf(e);
      if(top>0&&top>prevTop[e.exerciseId]) pr={name:e.name,weight:top};
    }
  });
  S.sessions.push({id:uid(),workoutId:w.id,workoutName:w.name,date:U.draft.date||today(),entries:entries});
  U.draft=null;
  U.modal={type:'postsave',name:w.name,pr:pr};
  commit();
}
function addBW(){
  const v=document.getElementById('bwV').value;
  const d=document.getElementById('bwD').value||today();
  if(v==='')return;
  S.bodyweight.push({id:uid(),date:d,value:Number(v)});
  commit();
}

/* ===================== SERVICE WORKER UPDATES ===================== */
let swUpdateReady=false;
function renderSwUpdate(){
  const el=document.getElementById('swupdate');
  if(!el) return;
  el.innerHTML = swUpdateReady
    ? '<div class="swbar">'+ic('spark','sm')+'<span style="flex:1">Neue Version verfügbar.</span><button data-swreload="1">Aktualisieren</button></div>'
    : '';
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
  // The service worker calls skipWaiting()+clients.claim(), so it takes over
  // silently in the background as soon as a new version is cached - but the
  // already-open tab keeps running the OLD html/js until reloaded. Without
  // this, a schema/logic update could sit uncalled-for indefinitely on an
  // installed PWA that's rarely fully closed. We only show the banner when
  // the controller changes AFTER one already existed (a real update takeover
  // on an already-open tab), not on the very first install.
  let sawController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!sawController){ sawController=true; return; }
    swUpdateReady=true; renderSwUpdate();
  });
}

/* ===================== INIT ===================== */
render();
// If a cloud session already exists, reconcile with the server shortly after
// startup. Deliberately non-blocking and failure-tolerant: the app is
// offline-first and must stay fully usable if the network or the cloud
// project is unavailable.
if(syncConfigured()&&syncLoggedIn()){
  setTimeout(()=>{ try{ doSync(); }catch(e){ console.error('Sync beim Start fehlgeschlagen:',e); } },1200);
}
